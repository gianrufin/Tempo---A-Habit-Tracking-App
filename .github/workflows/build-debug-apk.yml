name: Build Android APK & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        id: prep_apk
        run: |
          mkdir -p release_artifacts
          APK_ORIGIN=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found original APK at: $APK_ORIGIN"
          cp "$APK_ORIGIN" release_artifacts/tempo-android-release.apk
          cp "$APK_ORIGIN" release_artifacts/tempo.apk
          cp "$APK_ORIGIN" release_artifacts/app-debug.apk
          echo "artifacts_dir=release_artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempo-apk
          path: release_artifacts/*
          retention-days: 30

      - name: Publish to GitHub Release (debug-latest)
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: debug-latest
          name: Tempo Android Build (Latest)
          body: |
            ## ⚡ Tempo Android APK Download
            Auto-built from commit `${{ github.sha }}`.
            
            ### Download Files:
            - **`tempo-android-release.apk`**: Direct Android package installer
            - **`tempo.apk`**: Quick package mirror
            - **`app-debug.apk`**: Standard Gradle debug build
            
            ### Installation:
            1. Download the APK file on your Android device.
            2. Open the file and enable **"Install unknown apps"** when prompted.
            3. Enjoy Tempo!
          prerelease: false
          make_latest: true
          files: |
            release_artifacts/tempo-android-release.apk
            release_artifacts/tempo.apk
            release_artifacts/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
